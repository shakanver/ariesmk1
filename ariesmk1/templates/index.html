<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ROS2 Camera Live Stream</title>
        <style>
            body {
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;
                background-color: #111;
            }
            #video-container {
                margin-bottom: 20px;
                border: 2px solid #555;
            }
            #controls-container {
                display: flex;
                flex-direction: column;
                gap: 10px;
            }
            .control-button {
                padding: 15px 30px;
                font-size: 18px;
                cursor: pointer;
                border: none;
                border-radius: 8px;
                transition: background-color 0.2s;
            }
            #up-button {
                background-color: #4CAF50; /* Green */
                color: white;
            }
            #up-button:active {
                background-color: #45a049;
            }
            #down-button {
                background-color: #f44336; /* Red */
                color: white;
            }
            #down-button:active {
                background-color: #da190b;
            }
        </style>
    </head>
    <body>
        <div id="video-container">
            <img src="{{ url_for('video_feed') }}" alt="ROS2 Camera Feed">
        </div>

        <div id="controls-container">
            <button id="up-button" class="control-button">UP (Take Off)</button>
            <button id="down-button" class="control-button">DOWN (Land)</button>
        </div>
    </body>
    <script>
        const THRUST_ENDPOINT = '/thrust';
        const INTERVAL_MS = 100;

        let thrustInterval = null; // To hold the interval timer ID

        /**
         * Sends a thrust command (up/down) to the Flask backend.
         * @param {string} direction - 'up' or 'down'
         */
        function sendThrustCommand(direction) {
            // Fetch API sends a request to the Flask server
            fetch(THRUST_ENDPOINT, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ direction: direction }),
            })
            .then(response => {
                // Check if the server responded successfully
                if (!response.ok) {
                    console.error('Failed to send command:', response.statusText);
                }
            })
            .catch(error => {
                console.error('Network or fetch error:', error);
            });
        }

        function stopThrust(e)
        {
            // Prevent default behavior (like zooming or scrolling) if generated by touch
            if(e && e.preventDefault)
            {
                e.preventDefault(); 
            }

            if (thrustInterval !== null)
            {
                clearInterval(thrustInterval);
                thrustInterval = null;
                console.log('Thrust stopped.');
            }
        }

        function startThrust(direction, e)
        {
            // Prevent default behavior (like selecting text)
            if(e && e.preventDefault)
            { 
                e.preventDefault();
            }
            
            stopThrust(); // Safety clear
            sendThrustCommand(direction); // Send immediate first command
            
            thrustInterval = setInterval(() => {
                sendThrustCommand(direction);
            }, INTERVAL_MS);
            console.log(`Continuous ${direction} thrust started...`);
        }

        function assignEvents(btn, direction)
        {
            // Mouse Events (Desktop)
            btn.addEventListener('mousedown', (e) => startThrust(direction, e));
            btn.addEventListener('mouseup', (e) => stopThrust(e));
            btn.addEventListener('mouseleave', (e) => stopThrust(e));

            // Touch Events (Phone/Tablet)
            btn.addEventListener('touchstart', (e) => startThrust(direction, e));
            btn.addEventListener('touchend', (e) => stopThrust(e));
            
            btn.oncontextmenu = function(event) {
                event.preventDefault();
                event.stopPropagation();
                return false;
            };
        }

        const upButton = document.getElementById('up-button');
        const downButton = document.getElementById('down-button');

        assignEvents(upButton, 'up');
        assignEvents(downButton, 'down');


    </script>
</html>
